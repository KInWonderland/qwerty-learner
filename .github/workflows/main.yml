name: Deploy Qwerty Learner

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: qwerty-learner-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BASE_PATH: ${{ secrets.BASE_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: BASE_PATH
          command_timeout: 30m
          script: |
            set -eu
            BASE_PATH="${BASE_PATH:-${{ secrets.BASE_PATH }}}"
            BASE_PATH="${BASE_PATH%/}"
            export BASE_PATH
            export ENV_REPO="${BASE_PATH}/env"
            export RUNTIME_ROOT="${BASE_PATH}/.deploy-runtime"

            # 1. 拉取主路径/env最新代码
            echo "=== Pulling latest env ==="
            (
              flock 9
              cd "${BASE_PATH}/env"
              git pull --ff-only
            ) 9>"${BASE_PATH}/.env.lock"

            # 2. 进入项目主路径拉取项目最新代码并执行部署
            cd "${BASE_PATH}/qwerty-learner"
            # Serialize checkout updates as well as container deployment.
            (
              flock 7
              git fetch origin master
              git merge --ff-only origin/master
              bash scripts/deploy.sh
            ) 7>"${BASE_PATH}/.qwerty-learner-checkout.lock"

      - name: Send Telegram notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *📢 GitHub Actions 运行报告*

            *构建状态*：${{ job.status == 'success' && '✅ 打包成功' || '❌ 打包失败' }}
            *项目名称*：`${{ github.repository }}`
            *触发分支*：`${{ github.ref_name }}`
            *最新提交*：_${{ github.event.head_commit.message }}_

            [点击查看完整构建日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
