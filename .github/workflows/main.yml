name: Deploy Qwerty Learner

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: qwerty-learner-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu

            # 同步独立环境仓库，确保网关域名和证书路径已配置。
            cd /home/ubuntu/env
            git pull --ff-only
            test -f /home/ubuntu/env/gateway-nginx/.env

            # 网关与 Qwerty 共用此 Docker 网络。
            docker network inspect public-gateway >/dev/null 2>&1 || \
              docker network create public-gateway || \
              docker network inspect public-gateway >/dev/null 2>&1

            cd /home/ubuntu/qwerty-learner
            git fetch origin master
            git reset --hard origin/master
            docker compose up -d --build --remove-orphans

      - name: Send Telegram notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *📢 GitHub Actions 运行报告*

            *构建状态*：${{ job.status == 'success' && '✅ 打包成功' || '❌ 打包失败' }}
            *项目名称*：`${{ github.repository }}`
            *触发分支*：`${{ github.ref_name }}`
            *最新提交*：_${{ github.event.head_commit.message }}_

            [点击查看完整构建日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
