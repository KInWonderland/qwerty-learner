name: Deploy Qwerty Learner

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: qwerty-learner-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BASE_PATH: ${{ secrets.BASE_PATH }}
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_SERVER_URL: ${{ github.server_url }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: BASE_PATH,DEPLOY_REPOSITORY,DEPLOY_SERVER_URL
          command_timeout: 30m
          script: |
            set -eu
            BASE_PATH="${BASE_PATH:-${{ secrets.BASE_PATH }}}"
            BASE_PATH="${BASE_PATH%/}"
            export BASE_PATH
            export ENV_REPO="${BASE_PATH}/env"
            export RUNTIME_ROOT="${BASE_PATH}/.deploy-runtime"

            GIT_HOST=${DEPLOY_SERVER_URL#https://}
            mkdir -p "${BASE_PATH}"

            # 1. 拉取或初始化主路径/env仓库
            echo "=== Ensuring latest env ==="
            ENV_DIR="${BASE_PATH}/env"
            ENV_REPO_URL="git@$GIT_HOST:${DEPLOY_REPOSITORY%%/*}/env.git"
            (
              flock 9
              if [ ! -e "$ENV_DIR" ]; then
                git clone --branch main --single-branch "$ENV_REPO_URL" "$ENV_DIR"
              elif [ ! -d "$ENV_DIR/.git" ]; then
                echo "Deployment directory exists but is not a Git checkout: $ENV_DIR" >&2
                exit 1
              else
                cd "$ENV_DIR"
                git pull --ff-only
              fi
            ) 9>"${BASE_PATH}/.env.lock"

            # 2. 进入项目主路径拉取项目最新代码并执行部署
            PROJECT_DIR="${BASE_PATH}/qwerty-learner"
            REPOSITORY="git@$GIT_HOST:$DEPLOY_REPOSITORY.git"
            (
              flock 7
              if [ ! -e "$PROJECT_DIR" ]; then
                git clone --branch master --single-branch "$REPOSITORY" "$PROJECT_DIR"
              elif [ ! -d "$PROJECT_DIR/.git" ]; then
                echo "Deployment directory exists but is not a Git checkout: $PROJECT_DIR" >&2
                exit 1
              fi
              cd "$PROJECT_DIR"
              if [ "$(git branch --show-current)" != master ]; then
                echo "Expected master branch; resolve the existing checkout before deploying." >&2
                exit 1
              fi
              if [ -n "$(git status --porcelain)" ]; then
                echo "Checkout has local changes; resolve them before deploying." >&2
                exit 1
              fi
              git fetch "$REPOSITORY" master
              git merge --ff-only FETCH_HEAD
              bash scripts/deploy.sh
            ) 7>"${BASE_PATH}/.qwerty-learner-checkout.lock"

      - name: Send Telegram notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *📢 GitHub Actions 运行报告*

            *构建状态*：${{ job.status == 'success' && '✅ 打包成功' || '❌ 打包失败' }}
            *项目名称*：`${{ github.repository }}`
            *触发分支*：`${{ github.ref_name }}`
            *最新提交*：_${{ github.event.head_commit.message }}_

            [点击查看完整构建日志](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
