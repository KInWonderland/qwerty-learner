name: Build and Push qwerty-learner

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: qwerty-learner-build
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Huawei SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Extract short sha
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_NAMESPACE }}/qwerty-learner:${{ steps.vars.outputs.short_sha }}
            ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_NAMESPACE }}/qwerty-learner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
