name: Build and Push qwerty-learner

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: qwerty-learner-build
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Huawei SWR
        run: |
          echo "${{ secrets.SWR_PASSWORD }}" | \
            docker login -u "${{ secrets.SWR_USERNAME }}" --password-stdin \
            "${{ secrets.SWR_REGISTRY }}"

      - name: Build and push image
        run: |
          TAG="${GITHUB_SHA::7}"
          IMAGE="${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_NAMESPACE }}/qwerty-learner"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
